<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Events</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  
  <style>

    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --border: #e6eaf0;
      --accent: #4f46e5;
      --accent-dark: #3730a3;
      --accent-soft: #eef2ff;
      --success-soft: #ecfdf3;
      --success: #087443;
      --warning-soft: #fff7e6;
      --warning: #a15c00;
      --danger: #ef4444;
      --shadow-sm: 0 2px 8px rgba(16, 24, 40, 0.05);
      --shadow-md: 0 10px 30px rgba(16, 24, 40, 0.08);
      --shadow-lg: 0 24px 70px rgba(16, 24, 40, 0.18);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .hidden {
      display: none !important;
    }


    /* =========================================
       LOGIN
    ========================================== */

    #loginPage {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(79, 70, 229, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(14, 165, 233, 0.14),
          transparent 30%
        ),
        #f4f7fb;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.96);
      padding: 38px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
    }

    .login-box h1 {
      text-align: center;
      font-size: 30px;
      letter-spacing: -0.7px;
      margin-bottom: 7px;
    }

    .login-box p {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8dee8;
      border-radius: 11px;
      outline: none;
      background: #fff;
      color: var(--text);
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.10);
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 13px 16px;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.22);
      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .login-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    #loginMessage {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #dc2626;
    }


    /* =========================================
       HEADER
    ========================================== */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(230, 234, 240, 0.9);
    }

    .header-inner {
      max-width: 1280px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      color: white;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 7px 18px rgba(79, 70, 229, 0.24);
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .logout-btn {
      border: 1px solid #fecaca;
      background: #fff5f5;
      color: #c62828;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: 0.15s ease;
    }

    .logout-btn:hover {
      background: #fee2e2;
    }


    /* =========================================
       MAIN LAYOUT
    ========================================== */

    main {
      max-width: 1280px;
      margin: auto;
      padding: 30px 24px 60px;
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 24px;
      align-items: start;
    }

    .events-area {
      min-width: 0;
    }

    .page-title {
      margin-bottom: 22px;
      padding: 2px 2px 0;
    }

    .page-title h2 {
      font-size: clamp(25px, 3vw, 32px);
      line-height: 1.15;
      letter-spacing: -0.9px;
      margin-bottom: 6px;
    }

    .page-title p {
      color: var(--muted);
      font-size: 14px;
    }


    /* =========================================
       EVENTS GRID
    ========================================== */

    .events-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }

    .event-card:hover {
      transform: translateY(-3px);
      border-color: #d7dcff;
      box-shadow: var(--shadow-md);
    }

    .event-poster {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background: #eef2f7;
    }

    .event-content {
      padding: 18px;
    }

    .common-badge {
      display: inline-flex;
      align-items: center;
      background: var(--warning-soft);
      color: var(--warning);
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .event-card h3 {
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: -0.2px;
      margin-bottom: 12px;
    }

    .event-info {
      display: grid;
      gap: 7px;
      margin-bottom: 13px;
    }

    .event-info div {
      color: #667085;
      font-size: 13px;
    }

    .event-info strong {
      color: #344054;
      font-weight: 700;
    }

    .event-description {
      color: #667085;
      line-height: 1.5;
      font-size: 13px;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-view-more {
      display: inline-block;
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 15px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .event-view-more:hover {
      text-decoration: underline;
    }

    .register-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      transition: 0.15s ease;
    }

    .register-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .no-events {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px 24px;
      text-align: center;
      border-radius: var(--radius);
      color: var(--muted);
      box-shadow: var(--shadow-sm);
    }


    /* =========================================
       CALENDAR SIDEBAR
    ========================================== */

    .calendar-sidebar {
      min-width: 0;
      position: sticky;
      top: 88px;
    }

    .calendar-panel {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #e5e9f2;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 12px 30px rgba(16, 24, 40, 0.07),
        0 2px 6px rgba(16, 24, 40, 0.03);
    }

    .calendar-panel-title {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 16px 17px;
      border-bottom: 1px solid #edf0f5;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.15px;
    }

    .calendar-panel-title span {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .calendar {
      background: var(--surface);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 15px;
      border-bottom: 1px solid #edf0f5;
    }

    .calendar-header h3 {
      font-size: 15px;
      letter-spacing: -0.2px;
    }

    .calendar-nav {
      display: flex;
      gap: 5px;
    }

    .calendar-nav button {
      border: 1px solid #e1e6ef;
      background: #f8fafc;
      color: #475467;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: 0.15s ease;
    }

    .calendar-nav button:hover {
      background: var(--accent-soft);
      border-color: #c7d2fe;
      color: var(--accent);
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .calendar-weekdays div {
      padding: 10px 2px;
      text-align: center;
      font-size: 9px;
      font-weight: 800;
      color: #98a2b3;
      text-transform: uppercase;
      letter-spacing: 0.45px;
      border-bottom: 1px solid #edf0f5;
    }

    .calendar-day {
      height: 58px;
      min-height: 58px;
      padding: 6px;
      border-right: 1px solid #eef1f5;
      border-bottom: 1px solid #eef1f5;
      cursor: pointer;
      position: relative;
      transition: background 0.12s ease;
    }

    .calendar-day:nth-child(7n) {
      border-right: none;
    }

    .calendar-day:hover {
      background: #f8f9ff;
    }

    .calendar-day.empty {
      background: #fbfcfd;
      cursor: default;
    }

    .day-number {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
    }

    .calendar-day.today .day-number {
      background: var(--accent);
      color: white;
    }

    .calendar-day.selected .day-number {
      box-shadow: inset 0 0 0 2px #c7d2fe;
      color: var(--accent);
    }

    .event-dot {
      width: 7px;
      height: 7px;
      padding: 0;
      margin: 5px auto 0;
      border-radius: 50%;
      background: var(--accent);
      display: block;
      font-size: 0;
      line-height: 0;
    }

    .event-dot.multiple {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border-radius: 6px;
      color: white;
      background: var(--accent);
      font-size: 10px;
      font-weight: 800;
      line-height: 18px;
      text-align: center;
    }

    .common-dot {
      background: var(--warning);
    }

    .event-dot.multiple.common-dot {
      color: #7a4700;
      background: var(--warning-soft);
    }

    .selected-date-events {
      border-top: 1px solid #edf0f5;
      padding: 14px;
      background: #fcfdff;
    }

    .selected-date-events h3 {
      margin-bottom: 10px;
      font-size: 14px;
    }

    .selected-date-events .events-grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .selected-date-events .event-card {
      box-shadow: none;
      border-radius: 11px;
    }

    .selected-date-events .event-poster {
      height: 145px;
    }

    .selected-date-events .event-content {
      padding: 13px;
    }

    .selected-date-events .event-card h3 {
      font-size: 15px;
    }

    .calendar-event-count {
      padding: 9px 0 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }


    /* =========================================
       EVENT DETAILS MODAL
    ========================================== */

    .event-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .event-modal {
      width: min(920px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      position: relative;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .event-modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.68);
      color: white;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .event-modal-close:hover {
      background: rgba(15, 23, 42, 0.9);
    }

    .event-modal-image-wrap {
      width: 100%;
      min-height: 160px;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .event-modal-image {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
    }

    .event-modal-no-image {
      padding: 70px 20px;
      color: #cbd5e1;
      text-align: center;
      font-size: 14px;
    }

    .event-modal-content {
      padding: 24px;
    }

    .event-modal-title {
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -0.6px;
      margin-bottom: 15px;
      color: var(--text);
    }

    .event-modal-info {
      display: grid;
      gap: 8px;
      margin-bottom: 17px;
    }

    .event-modal-info div {
      color: #667085;
      font-size: 14px;
    }

    .event-modal-info strong {
      color: #344054;
    }

    .event-modal-description {
      color: #667085;
      line-height: 1.7;
      white-space: pre-line;
      margin-bottom: 19px;
      font-size: 14px;
    }

    .event-modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .event-modal-register {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
    }

    .event-modal-register:hover {
      background: var(--accent-dark);
    }

    .event-modal-qr-note {
      padding: 10px 13px;
      border-radius: 9px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: #475467;
      font-size: 13px;
      font-weight: 600;
    }


    /* =========================================
       RESPONSIVE
    ========================================== */

    @media (min-width: 1450px) {

      .events-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .event-poster {
        height: 205px;
      }

    }


    @media (max-width: 1050px) {

      .dashboard-layout {
        grid-template-columns: minmax(0, 1fr) 310px;
        gap: 18px;
      }

      .events-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .event-poster {
        height: 220px;
      }

    }


    @media (max-width: 820px) {

      .dashboard-layout {
        grid-template-columns: 1fr;
      }

      .calendar-sidebar {
        position: static;
        order: -1;
      }

      .calendar-panel {
        max-width: 560px;
        margin: 0 auto 4px;
      }

      .events-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .event-poster {
        height: 210px;
      }

    }


    @media (max-width: 520px) {

      .events-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .event-poster {
        height: 150px;
      }

      .event-content {
        padding: 13px;
      }

      .event-card h3 {
        font-size: 15px;
      }

      .event-info div,
      .event-description {
        font-size: 12px;
      }

    }


    @media (max-width: 600px) {

      #loginPage {
        padding: 15px;
      }

      .login-box {
        padding: 27px 20px;
        border-radius: 19px;
      }

      .header-inner {
        padding: 11px 15px;
      }

      .brand-mark {
        width: 35px;
        height: 35px;
      }

      .brand-subtitle {
        display: none;
      }

      main {
        padding: 20px 15px 40px;
      }

      .page-title {
        margin-bottom: 17px;
      }

      .page-title h2 {
        font-size: 25px;
      }

      .events-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .event-poster {
        height: 220px;
      }

      .event-content {
        padding: 16px;
      }

      .calendar-panel {
        border-radius: 14px;
      }

      .calendar-day {
        height: 52px;
        min-height: 52px;
        padding: 5px;
      }

      .day-number {
        width: 22px;
        height: 22px;
      }

      .event-dot {
        width: 6px;
        height: 6px;
      }

      .event-dot.multiple {
        width: 17px;
        height: 17px;
        font-size: 9px;
        line-height: 17px;
      }

      .event-modal-overlay {
        padding: 10px;
      }

      .event-modal {
        max-height: calc(100vh - 20px);
        border-radius: 15px;
      }

      .event-modal-image {
        max-height: 54vh;
      }

      .event-modal-content {
        padding: 18px;
      }

      .event-modal-title {
        font-size: 21px;
      }

      .event-modal-actions {
        width: 100%;
      }

      .event-modal-register {
        width: 100%;
      }

    }


    @media (max-width: 360px) {

      .brand-name {
        font-size: 14px;
      }

      .logout-btn {
        padding: 8px 10px;
      }

      .calendar-header {
        padding: 12px;
      }

      .calendar-nav button {
        min-width: 27px;
      }

      .calendar-day {
        height: 48px;
        min-height: 48px;
        padding: 4px;
      }

      .event-dot {
        width: 5px;
        height: 5px;
        display: block;
      }

      .events-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .event-poster {
        height: 125px;
      }

      .event-content {
        padding: 10px;
      }

      .event-card h3 {
        font-size: 14px;
      }

      .event-info div,
      .event-description {
        font-size: 11px;
      }

    }

  </style>


</head>


<body>


  <!-- =========================================
       LOGIN PAGE
  ========================================== -->

  <section id="loginPage">

    <div class="login-box">

      <h1>
        Events
      </h1>

      <p>
        Sign in to view events
      </p>


      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

        </div>


        <button
          class="login-btn"
          type="submit"
        >
          Login
        </button>


        <div id="loginMessage"></div>

      </form>

    </div>

  </section>



  <!-- =========================================
       USER APPLICATION
  ========================================== -->

  <section
    id="app"
    class="hidden"
  >


    <!-- HEADER -->

    <header>

      <div class="header-inner">

        <div class="brand">
          <div class="brand-mark">E</div>

          <div class="brand-copy">
            <div class="brand-name">Events</div>
            <div class="brand-subtitle">Discover what’s happening</div>

        <button

    <!-- MAIN -->

    <main>

      <div class="dashboard-layout">

        <section class="events-area">

          <div class="page-title">

          <div

          ></div>

        <aside class="calendar-sidebar">

          <div class="calendar-panel">

            <div class="calendar-panel-title">
              <span class="calendar-icon" aria-hidden="true">
                <svg

                  fill="none"

                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4.5" width="18" height="17" rx="3"></rect>
                  <path d="M7 2.5v4M17 2.5v4M3 9h18"></path>
                  <path d="M8 13h2M14 13h2M8 17h2M14 17h2"></path>
                </svg>
              </span>
              <div>Event Calendar</div>

            <div class="calendar">

              <div class="calendar-header">

                <div class="calendar-nav">

                  <button id="todayBtn" type="button">Today</button>

              <div class="calendar-weekdays">

              <div
                id="calendarDays"
                class="calendar-days"

  <!-- =========================================
       EVENT DETAILS MODAL
  ========================================== -->

  <div
    id="eventModalOverlay"
    class="event-modal-overlay hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Event details"
  >

    <div class="event-modal">

      <button
        id="eventModalClose"
        class="event-modal-close"
        type="button"
        aria-label="Close event details"
      >
        ×
      </button>

      <div
        id="eventModalImageWrap"
        class="event-modal-image-wrap"
      ></div>

      <div class="event-modal-content">

        <h2
          id="eventModalTitle"
          class="event-modal-title"
        ></h2>

        <div
          id="eventModalInfo"
          class="event-modal-info"
        ></div>

        <div
          id="eventModalDescription"
          class="event-modal-description"

        <div
          id="eventModalActions"
          class="event-modal-actions"
        ></div>

      </div>

    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>


    /* =========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://wuxluaekflqvvhtghrok.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_5lGI_aAjnq3uQKXBEPqUvA_yf6_eFKL";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =========================================
       VARIABLES
    ========================================== */

    let events = [];

    let calendarDate =
      new Date();

    let selectedCalendarDate =
      null;



    /* =========================================
       ELEMENTS
    ========================================== */

    const loginPage =
      document.getElementById(
        "loginPage"
      );


    const app =
      document.getElementById(
        "app"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const eventsContainer =
      document.getElementById(
        "eventsContainer"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const calendarMonth =
      document.getElementById(
        "calendarMonth"
      );


    const calendarDays =
      document.getElementById(
        "calendarDays"
      );


    const selectedDateEvents =
      document.getElementById(
        "selectedDateEvents"
      );


    const eventModalOverlay =
      document.getElementById(
        "eventModalOverlay"
      );


    const eventModalClose =
      document.getElementById(
        "eventModalClose"
      );


    const eventModalImageWrap =
      document.getElementById(
        "eventModalImageWrap"
      );


    const eventModalTitle =
      document.getElementById(
        "eventModalTitle"
      );


    const eventModalInfo =
      document.getElementById(
        "eventModalInfo"
      );


    const eventModalDescription =
      document.getElementById(
        "eventModalDescription"
      );


    const eventModalActions =
      document.getElementById(
        "eventModalActions"
      );



    /* =========================================
       LOGIN
    ========================================== */

    loginForm.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        loginMessage.textContent =
          "";


        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "password"
            )
            .value;


        const {
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email,

              password

            });


        if (error) {

          console.error(error);


          loginMessage.textContent =
            "Invalid email or password.";


          return;

        }


        loginForm.reset();


        showApp();

      }
    );



    /* =========================================
       LOGOUT
    ========================================== */

    logoutBtn.addEventListener(
      "click",
      async function() {

        await supabaseClient
          .auth
          .signOut();


        showLogin();

      }
    );



    /* =========================================
       AUTH STATE
    ========================================== */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(event, session) {

          if (session) {

            showApp();

          }

          else {

            showLogin();

          }

        }
      );



    /* =========================================
       SHOW LOGIN
    ========================================== */

    function showLogin() {

      loginPage.classList.remove(
        "hidden"
      );


      app.classList.add(
        "hidden"
      );

    }



    /* =========================================
       SHOW APP
    ========================================== */

    async function showApp() {

      loginPage.classList.add(
        "hidden"
      );


      app.classList.remove(
        "hidden"
      );


      await loadEvents();

    }



    /* =========================================
       LOAD EVENTS
    ========================================== */

    async function loadEvents() {

      eventsContainer.innerHTML =
        '<div class="no-events">Loading events...</div>';


      const {
        data,
        error
      } =
        await supabaseClient
          .from("events")
          .select("*")
          .order(
            "event_date",
            {
              ascending: true
            }
          )
          .order(
            "event_time",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(error);


        eventsContainer.innerHTML =
          '<div class="no-events">Unable to load events.</div>';


        return;

      }


      events =
        (data || [])
          .sort(
            function(a, b) {

              const dateCompare =
                b.event_date.localeCompare(
                  a.event_date
                );

              if (dateCompare !== 0) {
                return dateCompare;
              }

              return (
                (b.event_time || "23:59:59")
                  .localeCompare(
                    a.event_time || "23:59:59"
                  )
              );

            }
          );


      renderEvents();


      if (events.length) {
        const todayString = createDateString(
          new Date().getFullYear(),
          new Date().getMonth() + 1,
          new Date().getDate()
        );

        const firstDate =
          events.find(event => event.event_date >= todayString)?.event_date ||
          events[0].event_date;

        selectedCalendarDate = firstDate;
        calendarDate = new Date(firstDate + "T00:00:00");
        renderCalendar();
        showDateEvents(firstDate);
      } else {
        renderCalendar();
        showDateEvents(createDateString(
          calendarDate.getFullYear(),
          calendarDate.getMonth() + 1,
          calendarDate.getDate()
        ));
      }

    }



    /* =========================================
       RENDER EVENTS
    ========================================== */

    function renderEvents() {

      if (!events.length) {

        eventsContainer.innerHTML =
          '<div class="no-events">No events available.</div>';


        return;

      }


      eventsContainer.innerHTML =
        "";


      events.forEach(
        function(event) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "event-card";



          /* POSTER */

          const poster =
            event.image_url
              ? `
                <img
                  class="event-poster"
                  src="${escapeAttribute(event.image_url)}"
                  alt="${escapeAttribute(event.title)}"
                  loading="lazy"
                >
              `
              : "";



          /* COMMON BADGE */

          const commonBadge =
            event.is_common
              ? `
                <span class="common-badge">
                  Common Event
                </span>
              `
              : "";



          /* REGISTRATION */

          const registrationButton =
            event.registration_link
              ? `
                <a
                  class="register-btn"
                  href="${escapeAttribute(event.registration_link)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Register
                </a>
              `
              : "";



          /* DATE */

          const formattedDate =
            formatDate(
              event.event_date
            );



          /* TIME */

          const formattedTime =
            event.event_time
              ? formatTime(
                  event.event_time
                )
              : "";



          card.innerHTML = `

            ${poster}

            <div class="event-content">

              ${commonBadge}


              <h3>
                ${escapeHTML(
                  event.title
                )}
              </h3>


              <div class="event-info">


                <div>

                  <strong>
                    Date:
                  </strong>

                  ${formattedDate}

                </div>


                ${
                  formattedTime
                    ? `
                      <div>

                        <strong>
                          Time:
                        </strong>

                        ${escapeHTML(
                          formattedTime
                        )}

                      </div>
                    `
                    : ""
                }


                ${
                  event.location
                    ? `
                      <div>

                        <strong>
                          Location:
                        </strong>

                        ${escapeHTML(
                          event.location
                        )}

                      </div>
                    `
                    : ""
                }


              </div>


              ${
                event.description
                  ? `
                    <div
                      class="event-description"
                      title="${escapeAttribute(event.description)}"
                    >
                      ${escapeHTML(event.description)}
                    </div>

                    <button
                      type="button"
                      class="event-view-more"
                    >
                      View more
                    </button>
                  `
                  : ""
              }


              ${registrationButton}

            </div>

          `;


          card.addEventListener(
            "click",
            function() {
              openEventModal(event);
            }
          );


          const registerLink =
            card.querySelector(".register-btn");

          if (registerLink) {
            registerLink.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
              }
            );
          }


          const viewMore =
            card.querySelector(".event-view-more");

          if (viewMore) {
            viewMore.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
                openEventModal(event);
              }
            );
          }


          eventsContainer.appendChild(
            card
          );

        }
      );

    }



    /* =========================================
       CALENDAR
    ========================================== */

    function renderCalendar() {

      const year =
        calendarDate.getFullYear();


      const month =
        calendarDate.getMonth();


      const monthName =
        calendarDate.toLocaleString(
          "default",
          {
            month: "long"
          }
        );


      calendarMonth.textContent =
        `${monthName} ${year}`;


      calendarDays.innerHTML =
        "";


      const firstDay =
        new Date(
          year,
          month,
          1
        ).getDay();


      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();



      /* EMPTY DAYS */

      for (
        let i = 0;
        i < firstDay;
        i++
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "calendar-day empty";


        calendarDays.appendChild(
          empty
        );

      }



      /* DAYS */

      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {


        const cell =
          document.createElement(
            "div"
          );


        cell.className =
          "calendar-day";


        const number =
          document.createElement(
            "div"
          );


        number.className =
          "day-number";


        number.textContent =
          day;


        cell.appendChild(
          number
        );


        const dateString =
          createDateString(
            year,
            month + 1,
            day
          );


        const today = new Date();
        const todayString = createDateString(
          today.getFullYear(),
          today.getMonth() + 1,
          today.getDate()
        );

        if (dateString === todayString) {
          cell.classList.add("today");
        }

        if (dateString === selectedCalendarDate) {
          cell.classList.add("selected");
        }


        const dayEvents =
          events.filter(
            function(event) {

              return (
                event.event_date ===
                dateString
              );

            }
          );



        if (dayEvents.length > 0) {

          const eventDot =
            document.createElement(
              "div"
            );


          eventDot.className =
            "event-dot";


          if (dayEvents.length > 1) {

            eventDot.classList.add(
              "multiple"
            );

            eventDot.textContent =
              "+";

          }


          if (
            dayEvents.some(
              function(event) {
                return event.is_common;
              }
            )
          ) {

            eventDot.classList.add(
              "common-dot"
            );

          }


          eventDot.title =
            dayEvents.length === 1
              ? "1 event"
              : `${dayEvents.length} events`;


          cell.appendChild(
            eventDot
          );

        }



        cell.addEventListener(
          "click",
          function() {

            selectedCalendarDate =
              dateString;

            renderCalendar();

            showDateEvents(
              dateString
            );

          }
        );


        calendarDays.appendChild(
          cell
        );

      }

    }



    /* =========================================
       DATE EVENTS
    ========================================== */

    function showDateEvents(
      dateString
    ) {


      const dayEvents =
        events.filter(
          function(event) {

            return (
              event.event_date ===
              dateString
            );

          }
        );


      selectedDateEvents.innerHTML =
        "";

      const count = document.createElement("div");
      count.className = "calendar-event-count";
      count.textContent = dayEvents.length === 1
        ? "1 event on this date"
        : `${dayEvents.length} events on this date`;
      selectedDateEvents.appendChild(count);

      const heading =
        document.createElement(
          "h3"
        );


      heading.textContent =
        formatDate(
          dateString
        );


      selectedDateEvents.appendChild(
        heading
      );



      if (!dayEvents.length) {


        const message =
          document.createElement(
            "div"
          );


        message.className =
          "no-events";


        message.textContent =
          "No events on this date.";


        selectedDateEvents.appendChild(
          message
        );


        return;

      }



      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "events-grid";



      dayEvents.forEach(
        function(event) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "event-card";



          const poster =
            event.image_url
              ? `
                <img
                  class="event-poster"
                  src="${escapeAttribute(event.image_url)}"
                  alt="${escapeAttribute(event.title)}"
                  loading="lazy"
                >
              `
              : "";



          const commonBadge =
            event.is_common
              ? `
                <span class="common-badge">
                  Common Event
                </span>
              `
              : "";



          const registrationButton =
            event.registration_link
              ? `
                <a
                  class="register-btn"
                  href="${escapeAttribute(event.registration_link)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Register
                </a>
              `
              : "";



          card.innerHTML = `

            ${poster}

            <div class="event-content">

              ${commonBadge}


              <h3>
                ${escapeHTML(
                  event.title
                )}
              </h3>


              <div class="event-info">


                ${
                  event.event_time
                    ? `
                      <div>

                        <strong>
                          Time:
                        </strong>

                        ${escapeHTML(
                          formatTime(
                            event.event_time
                          )
                        )}

                      </div>
                    `
                    : ""
                }


                ${
                  event.location
                    ? `
                      <div>

                        <strong>
                          Location:
                        </strong>

                        ${escapeHTML(
                          event.location
                        )}

                      </div>
                    `
                    : ""
                }


              </div>


              ${
                event.description
                  ? `
                    <div
                      class="event-description"
                      title="${escapeAttribute(event.description)}"
                    >
                      ${escapeHTML(event.description)}
                    </div>

                    <button
                      type="button"
                      class="event-view-more"
                    >
                      View more
                    </button>
                  `
                  : ""
              }


              ${registrationButton}

            </div>

          `;


          card.addEventListener(
            "click",
            function() {
              openEventModal(event);
            }
          );


          const registerLink =
            card.querySelector(".register-btn");

          if (registerLink) {
            registerLink.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
              }
            );
          }


          const viewMore =
            card.querySelector(".event-view-more");

          if (viewMore) {
            viewMore.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
                openEventModal(event);
              }
            );
          }


          grid.appendChild(
            card
          );

        }
      );


      selectedDateEvents.appendChild(
        grid
      );

    }



    /* =========================================
       EVENT DETAILS MODAL
    ========================================== */

    function openEventModal(event) {

      eventModalTitle.textContent =
        event.title || "Event";


      eventModalImageWrap.innerHTML =
        event.image_url
          ? `
            <img
              class="event-modal-image"
              src="${escapeAttribute(event.image_url)}"
              alt="${escapeAttribute(event.title || "Event poster")}"
            >
          `
          : `
            <div class="event-modal-no-image">
              No poster available for this event.
            </div>
          `;


      const infoParts = [];

      if (event.event_date) {
        infoParts.push(
          `<div><strong>Date:</strong> ${escapeHTML(formatDate(event.event_date))}</div>`
        );
      }

      if (event.event_time) {
        infoParts.push(
          `<div><strong>Time:</strong> ${escapeHTML(formatTime(event.event_time))}</div>`
        );
      }

      if (event.location) {
        infoParts.push(
          `<div><strong>Location:</strong> ${escapeHTML(event.location)}</div>`
        );
      }

      eventModalInfo.innerHTML =
        infoParts.join("");


      eventModalDescription.textContent =
        event.description || "";

      eventModalDescription.classList.toggle(
        "hidden",
        !event.description
      );


      if (event.registration_link) {
        eventModalActions.innerHTML = `
          <a
            class="event-modal-register"
            href="${escapeAttribute(event.registration_link)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Register
          </a>
        `;
      } else if (event.image_url) {
        eventModalActions.innerHTML = `
          <div class="event-modal-qr-note">
            Scan the QR code in the poster to register.
          </div>
        `;
      } else {
        eventModalActions.innerHTML = "";
      }


      eventModalOverlay.classList.remove(
        "hidden"
      );

      document.body.style.overflow =
        "hidden";
    }


    function closeEventModal() {

      eventModalOverlay.classList.add(
        "hidden"
      );

      document.body.style.overflow =
        "";
    }


    eventModalClose.addEventListener(
      "click",
      closeEventModal
    );


    eventModalOverlay.addEventListener(
      "click",
      function(e) {
        if (e.target === eventModalOverlay) {
          closeEventModal();
        }
      }
    );


    document.addEventListener(
      "keydown",
      function(e) {
        if (
          e.key === "Escape" &&
          !eventModalOverlay.classList.contains("hidden")
        ) {
          closeEventModal();
        }
      }
    );


    /* =========================================
       CALENDAR NAVIGATION
    ========================================== */

    document
      .getElementById(
        "previousMonth"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate.setMonth(
            calendarDate.getMonth() - 1
          );


          renderCalendar();

        }
      );



    document
      .getElementById(
        "nextMonth"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate.setMonth(
            calendarDate.getMonth() + 1
          );


          renderCalendar();

        }
      );



    document
      .getElementById(
        "todayBtn"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate =
            new Date();


          renderCalendar();

        }
      );



    /* =========================================
       DATE HELPERS
    ========================================== */

    function createDateString(
      year,
      month,
      day
    ) {

      return (

        year +

        "-" +

        String(month)
          .padStart(
            2,
            "0"
          ) +

        "-" +

        String(day)
          .padStart(
            2,
            "0"
          )

      );

    }



    function formatDate(
      dateString
    ) {


      const date =
        new Date(
          dateString +
          "T00:00:00"
        );


      return date.toLocaleDateString(
        undefined,
        {

          day: "numeric",

          month: "long",

          year: "numeric"

        }
      );

    }



    function formatTime(
      timeString
    ) {


      const parts =
        timeString.split(":");


      const date =
        new Date();


      date.setHours(

        Number(
          parts[0]
        ),

        Number(
          parts[1]
        ),

        0

      );


      return date.toLocaleTimeString(
        undefined,
        {

          hour: "numeric",

          minute: "2-digit"

        }
      );

    }



    /* =========================================
       SECURITY HELPERS
    ========================================== */

    function escapeHTML(
      value
    ) {


      if (

        value === null ||

        value === undefined

      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    function escapeAttribute(
      value
    ) {

      return escapeHTML(
        value
      );

    }



    /* =========================================
       INITIAL AUTH CHECK
    ========================================== */

    async function initialize() {


      const {

        data: {
          session
        }

      } =
        await supabaseClient
          .auth
          .getSession();


      if (session) {

        showApp();

      }

      else {

        showLogin();

      }

    }


    initialize();

  </script>
