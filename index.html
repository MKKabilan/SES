<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Events</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  
  
<style>
  :root {
    --bg: #16071f;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.72);
    --glass: rgba(255,255,255,0.13);
    --glass-strong: rgba(255,255,255,0.19);
    --glass-border: rgba(255,255,255,0.25);
    --pink: #ff006e;
    --magenta: #c00080;
    --purple: #6a00a8;
    --orange: #ff4b00;
    --yellow: #ffc400;
    --shadow: 0 18px 55px rgba(20, 0, 35, 0.28);
    --radius: 20px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family:
      Inter,
      ui-sans-serif,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(
        circle at 5% 8%,
        rgba(255, 77, 0, 0.95) 0,
        rgba(255, 77, 0, 0.38) 22%,
        transparent 42%
      ),
      radial-gradient(
        circle at 96% 12%,
        rgba(255, 0, 110, 0.9) 0,
        rgba(255, 0, 110, 0.38) 24%,
        transparent 45%
      ),
      radial-gradient(
        circle at 82% 92%,
        rgba(106, 0, 168, 0.95) 0,
        rgba(106, 0, 168, 0.48) 25%,
        transparent 48%
      ),
      linear-gradient(
        135deg,
        #ff4b00 0%,
        #ed005f 34%,
        #c00080 62%,
        #5f00a8 100%
      );
    background-attachment: fixed;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(55px);
    pointer-events: none;
  }

  body::before {
    width: 280px;
    height: 280px;
    left: -80px;
    top: 35%;
    background: rgba(255, 122, 0, 0.38);
  }

  body::after {
    width: 340px;
    height: 340px;
    right: -100px;
    bottom: 5%;
    background: rgba(111, 0, 180, 0.48);
  }

  button,
  input {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .hidden {
    display: none !important;
  }


  /* =========================================
     GLASS PRIMITIVES
  ========================================== */

  header,
  .login-box,
  .event-card,
  .calendar-panel,
  .no-events,
  .selected-date-events,
  .event-modal,
  .event-modal-qr-note {
    background: rgba(255,255,255,0.13);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(22px) saturate(145%);
    -webkit-backdrop-filter: blur(22px) saturate(145%);
  }


  /* =========================================
     LOGIN
  ========================================== */

  #loginPage {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-box {
    width: 100%;
    max-width: 420px;
    padding: 38px;
    border-radius: 28px;
  }

  .login-box h1 {
    text-align: center;
    font-size: 31px;
    letter-spacing: -0.8px;
    margin-bottom: 7px;
  }

  .login-box p {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 17px;
  }

  .form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
  }

  .form-group input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 12px;
    outline: none;
    background: rgba(255,255,255,0.11);
    color: white;
    transition: 0.15s ease;
  }

  .form-group input::placeholder {
    color: rgba(255,255,255,0.55);
  }

  .form-group input:focus {
    border-color: rgba(255,255,255,0.65);
    box-shadow:
      0 0 0 4px rgba(255,255,255,0.09),
      0 8px 24px rgba(255,0,110,0.16);
  }

  .login-btn {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 13px 16px;
    border-radius: 12px;
    background:
      linear-gradient(
        135deg,
        #ff4b00,
        #ff006e 52%,
        #8f00b8
      );
    color: white;
    cursor: pointer;
    font-weight: 800;
    box-shadow:
      0 10px 26px rgba(255,0,110,0.28);
    transition: 0.16s ease;
  }

  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 14px 32px rgba(255,0,110,0.36);
  }

  #loginMessage {
    min-height: 20px;
    margin-top: 14px;
    text-align: center;
    font-size: 13px;
    color: #ffe4ed;
  }


  /* =========================================
     HEADER
  ========================================== */

  header {
    position: sticky;
    top: 12px;
    z-index: 50;
    max-width: 1320px;
    margin: 12px auto 0;
    border-radius: 18px;
  }

  .header-inner {
    max-width: 1280px;
    margin: auto;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 21px;
    font-weight: 800;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background:
      linear-gradient(
        135deg,
        #ff4b00,
        #ff006e 52%,
        #7200aa
      );
    color: white;
    font-size: 16px;
    font-weight: 900;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow:
      0 8px 24px rgba(255,0,110,0.28);
  }

  .brand-copy {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 850;
  }

  .brand-subtitle {
    margin-top: 3px;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.68);
  }

  .logout-btn {
    border: 1px solid rgba(255,255,255,0.30);
    background: rgba(255,255,255,0.10);
    color: white;
    padding: 9px 14px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 750;
    transition: 0.15s ease;
  }

  .logout-btn:hover {
    background: rgba(255,255,255,0.20);
    transform: translateY(-1px);
  }


  /* =========================================
     MAIN
  ========================================== */

  main {
    max-width: 1320px;
    margin: auto;
    padding: 32px 24px 64px;
  }

  .dashboard-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 24px;
    align-items: start;
  }

  .events-area {
    min-width: 0;
  }

  .page-title {
    margin-bottom: 22px;
    padding: 2px 2px 0;
  }

  .page-title h2 {
    font-size: clamp(27px, 3vw, 34px);
    line-height: 1.15;
    letter-spacing: -1px;
    margin-bottom: 6px;
  }

  .page-title p {
    color: rgba(255,255,255,0.74);
    font-size: 14px;
  }


  /* =========================================
     EVENT CARDS
  ========================================== */

  .events-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .event-card {
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition:
      transform 0.18s ease,
      background 0.18s ease,
      border-color 0.18s ease;
  }

  .event-card:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.36);
  }

  .event-poster {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
    background: rgba(0,0,0,0.12);
  }

  .event-content {
    padding: 18px;
  }

  .common-badge {
    display: inline-flex;
    align-items: center;
    background: rgba(255,196,0,0.17);
    color: #fff1b8;
    border: 1px solid rgba(255,196,0,0.32);
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .event-card h3 {
    font-size: 18px;
    line-height: 1.3;
    letter-spacing: -0.2px;
    margin-bottom: 12px;
  }

  .event-info {
    display: grid;
    gap: 7px;
    margin-bottom: 13px;
  }

  .event-info div {
    color: rgba(255,255,255,0.70);
    font-size: 13px;
  }

  .event-info strong {
    color: rgba(255,255,255,0.94);
    font-weight: 750;
  }

  .event-description {
    color: rgba(255,255,255,0.68);
    line-height: 1.5;
    font-size: 13px;
    margin-bottom: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .event-view-more {
    display: inline-block;
    border: none;
    background: none;
    padding: 0;
    margin-bottom: 15px;
    color: #ffd6ea;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  .event-view-more:hover {
    color: white;
    text-decoration: underline;
  }

  .register-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(
        135deg,
        #ff4b00,
        #ff006e 55%,
        #8300b3
      );
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    border: 1px solid rgba(255,255,255,0.24);
    box-shadow:
      0 8px 20px rgba(255,0,110,0.22);
    transition: 0.15s ease;
  }

  .register-btn:hover {
    transform: translateY(-1px);
    box-shadow:
      0 12px 25px rgba(255,0,110,0.32);
  }

  .no-events {
    grid-column: 1 / -1;
    padding: 40px 24px;
    text-align: center;
    border-radius: 20px;
    color: rgba(255,255,255,0.72);
  }


  /* =========================================
     CALENDAR
  ========================================== */

  .calendar-sidebar {
    min-width: 0;
    position: sticky;
    top: 92px;
  }

  .calendar-panel {
    border-radius: 20px;
    overflow: hidden;
  }

  .calendar-panel-title {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 16px 17px;
    border-bottom: 1px solid rgba(255,255,255,0.16);
    font-size: 14px;
    font-weight: 800;
  }

  .calendar-panel-title span {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    flex: 0 0 32px;
    border-radius: 10px;
    background: rgba(255,255,255,0.14);
    color: white;
  }

  .calendar {
    background: transparent;
  }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }

  .calendar-header h3 {
    font-size: 15px;
    letter-spacing: -0.35px;
  }

  .calendar-nav {
    display: flex;
    gap: 5px;
  }

  .calendar-nav button {
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.09);
    color: white;
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 750;
    transition: 0.15s ease;
  }

  .calendar-nav button:hover {
    background: rgba(255,255,255,0.19);
    border-color: rgba(255,255,255,0.38);
  }

  .calendar-weekdays,
  .calendar-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .calendar-weekdays div {
    padding: 10px 2px;
    text-align: center;
    font-size: 9px;
    font-weight: 800;
    color: rgba(255,255,255,0.56);
    text-transform: uppercase;
    letter-spacing: 0.45px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  .calendar-day {
    height: 58px;
    min-height: 58px;
    padding: 7px;
    border-right: 1px solid rgba(255,255,255,0.11);
    border-bottom: 1px solid rgba(255,255,255,0.11);
    cursor: pointer;
    position: relative;
    background: rgba(255,255,255,0.025);
    transition:
      background 0.15s ease,
      box-shadow 0.15s ease;
  }

  .calendar-day:nth-child(7n) {
    border-right: none;
  }

  .calendar-day:hover {
    background: rgba(255,255,255,0.10);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.14);
  }

  .calendar-day.empty {
    background: rgba(0,0,0,0.025);
    cursor: default;
  }

  .day-number {
    width: 25px;
    height: 25px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 800;
    color: white;
  }

  .calendar-day.today .day-number {
    background:
      linear-gradient(
        135deg,
        #ff4b00,
        #ff006e
      );
    color: white;
    box-shadow:
      0 5px 14px rgba(255,0,110,0.30);
  }

  .calendar-day.selected .day-number {
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,0.78);
    color: white;
    background: rgba(255,255,255,0.12);
  }

  .calendar-day.today.selected .day-number {
    color: white;
    background:
      linear-gradient(
        135deg,
        #ff4b00,
        #ff006e
      );
  }

  .event-dot {
    width: 7px;
    height: 7px;
    padding: 0;
    margin: 6px auto 0;
    border-radius: 50%;
    background: #ffd6ea;
    display: block;
    font-size: 0;
    line-height: 0;
    box-shadow:
      0 0 8px rgba(255,214,234,0.48);
  }

  .event-dot.multiple {
    width: auto;
    height: 16px;
    margin: 2px auto 0;
    border-radius: 0;
    background: transparent;
    color: #ffd6ea;
    font-size: 13px;
    font-weight: 900;
    line-height: 16px;
    text-align: center;
    letter-spacing: -1px;
  }

  .event-dot.multiple::before {
    content: "•";
    display: inline-block;
    margin-right: 2px;
    font-size: 15px;
    line-height: 14px;
  }

  .event-dot.multiple::after {
    content: "+";
    display: inline-block;
    font-size: 12px;
    line-height: 14px;
  }

  .common-dot {
    background: #ffd34d;
    box-shadow:
      0 0 8px rgba(255,211,77,0.35);
  }

  .event-dot.multiple.common-dot {
    background: transparent;
    color: #ffd34d;
  }

  .selected-date-events {
    border-top: 1px solid rgba(255,255,255,0.14);
    padding: 15px;
    background: rgba(255,255,255,0.06);
  }

  .selected-date-events h3 {
    margin-bottom: 10px;
    font-size: 14px;
  }

  .selected-date-events .events-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .selected-date-events .event-card {
    box-shadow: none;
    background: rgba(255,255,255,0.10);
    border-radius: 13px;
  }

  .selected-date-events .event-poster {
    height: 145px;
  }

  .selected-date-events .event-content {
    padding: 13px;
  }

  .selected-date-events .event-card h3 {
    font-size: 15px;
  }

  .calendar-event-count {
    padding: 9px 0 10px;
    color: rgba(255,255,255,0.67);
    font-size: 11px;
    font-weight: 600;
  }


  /* =========================================
     EVENT MODAL
  ========================================== */

  .event-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(20, 0, 35, 0.64);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .event-modal {
    width: min(920px, 100%);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    border-radius: 24px;
    position: relative;
  }

  .event-modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 2;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,0.30);
    border-radius: 50%;
    background: rgba(20,0,35,0.55);
    color: white;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }

  .event-modal-close:hover {
    background: rgba(255,255,255,0.20);
  }

  .event-modal-image-wrap {
    width: 100%;
    min-height: 160px;
    background: rgba(10,0,20,0.30);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .event-modal-image {
    display: block;
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
  }

  .event-modal-no-image {
    padding: 70px 20px;
    color: rgba(255,255,255,0.72);
    text-align: center;
    font-size: 14px;
  }

  .event-modal-content {
    padding: 24px;
  }

  .event-modal-title {
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: -0.6px;
    margin-bottom: 15px;
  }

  .event-modal-info {
    display: grid;
    gap: 8px;
    margin-bottom: 17px;
  }

  .event-modal-info div {
    color: rgba(255,255,255,0.72);
    font-size: 14px;
  }

  .event-modal-info strong {
    color: white;
  }

  .event-modal-description {
    color: rgba(255,255,255,0.74);
    line-height: 1.7;
    white-space: pre-line;
    margin-bottom: 19px;
    font-size: 14px;
  }

  .event-modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .event-modal-register {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(
        135deg,
        #ff4b00,
        #ff006e 55%,
        #8300b3
      );
    color: white;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    border: 1px solid rgba(255,255,255,0.24);
    box-shadow:
      0 8px 20px rgba(255,0,110,0.22);
  }

  .event-modal-qr-note {
    padding: 10px 13px;
    border-radius: 10px;
    color: white;
    font-size: 13px;
    font-weight: 600;
  }


  /* =========================================
     RESPONSIVE
  ========================================== */

  @media (min-width: 1450px) {
    .events-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .event-poster {
      height: 205px;
    }
  }

  @media (max-width: 1050px) {
    .dashboard-layout {
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
    }

    .events-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .event-poster {
      height: 220px;
    }
  }

  @media (max-width: 820px) {
    .dashboard-layout {
      grid-template-columns: 1fr;
    }

    .calendar-sidebar {
      position: static;
      order: -1;
    }

    .calendar-panel {
      max-width: 560px;
      margin: 0 auto 4px;
    }

    .events-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .event-poster {
      height: 210px;
    }

    header {
      top: 8px;
      margin-top: 8px;
    }
  }

  @media (max-width: 600px) {
    #loginPage {
      padding: 15px;
    }

    .login-box {
      padding: 27px 20px;
      border-radius: 22px;
    }

    header {
      top: 7px;
      margin: 7px 8px 0;
    }

    .header-inner {
      padding: 10px 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
    }

    .brand-subtitle {
      display: none;
    }

    main {
      padding: 22px 12px 45px;
    }

    .page-title {
      margin-bottom: 17px;
    }

    .page-title h2 {
      font-size: 25px;
    }

    .events-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .event-poster {
      height: 155px;
    }

    .event-content {
      padding: 13px;
    }

    .event-card h3 {
      font-size: 15px;
    }

    .event-info div,
    .event-description {
      font-size: 12px;
    }

    .calendar-panel {
      border-radius: 18px;
    }

    .calendar-day {
      height: 52px;
      min-height: 52px;
      padding: 5px;
    }

    .event-dot {
      width: 6px;
      height: 6px;
    }

    .event-dot.multiple {
      width: auto;
      height: 16px;
      font-size: 12px;
      line-height: 16px;
    }

  <!-- =========================================

  >

        ×

  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>


    /* =========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://wuxluaekflqvvhtghrok.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_5lGI_aAjnq3uQKXBEPqUvA_yf6_eFKL";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =========================================
       VARIABLES
    ========================================== */

    let events = [];

    let calendarDate =
      new Date();

    let selectedCalendarDate =
      null;



    /* =========================================
       ELEMENTS
    ========================================== */

    const loginPage =
      document.getElementById(
        "loginPage"
      );


    const app =
      document.getElementById(
        "app"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const eventsContainer =
      document.getElementById(
        "eventsContainer"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const calendarMonth =
      document.getElementById(
        "calendarMonth"
      );


    const calendarDays =
      document.getElementById(
        "calendarDays"
      );


    const selectedDateEvents =
      document.getElementById(
        "selectedDateEvents"
      );


    const eventModalOverlay =
      document.getElementById(
        "eventModalOverlay"
      );


    const eventModalClose =
      document.getElementById(
        "eventModalClose"
      );


    const eventModalImageWrap =
      document.getElementById(
        "eventModalImageWrap"
      );


    const eventModalTitle =
      document.getElementById(
        "eventModalTitle"
      );


    const eventModalInfo =
      document.getElementById(
        "eventModalInfo"
      );


    const eventModalDescription =
      document.getElementById(
        "eventModalDescription"
      );


    const eventModalActions =
      document.getElementById(
        "eventModalActions"
      );



    /* =========================================
       LOGIN
    ========================================== */

    loginForm.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        loginMessage.textContent =
          "";


        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "password"
            )
            .value;


        const {
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email,

              password

            });


        if (error) {

          console.error(error);


          loginMessage.textContent =
            "Invalid email or password.";


          return;

        }


        loginForm.reset();


        showApp();

      }
    );



    /* =========================================
       LOGOUT
    ========================================== */

    logoutBtn.addEventListener(
      "click",
      async function() {

        await supabaseClient
          .auth
          .signOut();


        showLogin();

      }
    );



    /* =========================================
       AUTH STATE
    ========================================== */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(event, session) {

          if (session) {

            showApp();

          }

          else {

            showLogin();

          }

        }
      );



    /* =========================================
       SHOW LOGIN
    ========================================== */

    function showLogin() {

      loginPage.classList.remove(
        "hidden"
      );


      app.classList.add(
        "hidden"
      );

    }



    /* =========================================
       SHOW APP
    ========================================== */

    async function showApp() {

      loginPage.classList.add(
        "hidden"
      );


      app.classList.remove(
        "hidden"
      );


      await loadEvents();

    }



    /* =========================================
       LOAD EVENTS
    ========================================== */

    async function loadEvents() {

      eventsContainer.innerHTML =
        '<div class="no-events">Loading events...</div>';


      const {
        data,
        error
      } =
        await supabaseClient
          .from("events")
          .select("*")
          .order(
            "event_date",
            {
              ascending: true
            }
          )
          .order(
            "event_time",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(error);


        eventsContainer.innerHTML =
          '<div class="no-events">Unable to load events.</div>';


        return;

      }


      events =
        (data || [])
          .sort(
            function(a, b) {

              const dateCompare =
                b.event_date.localeCompare(
                  a.event_date
                );

              if (dateCompare !== 0) {
                return dateCompare;
              }

              return (
                (b.event_time || "23:59:59")
                  .localeCompare(
                    a.event_time || "23:59:59"
                  )
              );

            }
          );


      renderEvents();


      if (events.length) {
        const todayString = createDateString(
          new Date().getFullYear(),
          new Date().getMonth() + 1,
          new Date().getDate()
        );

        const firstDate =
          events.find(event => event.event_date >= todayString)?.event_date ||
          events[0].event_date;

        selectedCalendarDate = firstDate;
        calendarDate = new Date(firstDate + "T00:00:00");
        renderCalendar();
        showDateEvents(firstDate);
      } else {
        renderCalendar();
        showDateEvents(createDateString(
          calendarDate.getFullYear(),
          calendarDate.getMonth() + 1,
          calendarDate.getDate()
        ));
      }

    }



    /* =========================================
       RENDER EVENTS
    ========================================== */

    function renderEvents() {

      if (!events.length) {

        eventsContainer.innerHTML =
          '<div class="no-events">No events available.</div>';


        return;

      }


      eventsContainer.innerHTML =
        "";


      events.forEach(
        function(event) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "event-card";



          /* POSTER */

          const poster =
            event.image_url
              ? `
                <img
                  class="event-poster"
                  src="${escapeAttribute(event.image_url)}"
                  alt="${escapeAttribute(event.title)}"
                  loading="lazy"
                >
              `
              : "";



          /* COMMON BADGE */

          const commonBadge =
            event.is_common
              ? `
                <span class="common-badge">
                  Common Event
                </span>
              `
              : "";



          /* REGISTRATION */

          const registrationButton =
            event.registration_link
              ? `
                <a
                  class="register-btn"
                  href="${escapeAttribute(event.registration_link)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Register
                </a>
              `
              : "";



          /* DATE */

          const formattedDate =
            formatDate(
              event.event_date
            );



          /* TIME */

          const formattedTime =
            event.event_time
              ? formatTime(
                  event.event_time
                )
              : "";



          card.innerHTML = `

            ${poster}

            <div class="event-content">

              ${commonBadge}


              <h3>
                ${escapeHTML(
                  event.title
                )}
              </h3>


              <div class="event-info">


                <div>

                  <strong>
                    Date:
                  </strong>

                  ${formattedDate}

                </div>


                ${
                  formattedTime
                    ? `
                      <div>

                        <strong>
                          Time:
                        </strong>

                        ${escapeHTML(
                          formattedTime
                        )}

                      </div>
                    `
                    : ""
                }


                ${
                  event.location
                    ? `
                      <div>

                        <strong>
                          Location:
                        </strong>

                        ${escapeHTML(
                          event.location
                        )}

                      </div>
                    `
                    : ""
                }


              </div>


              ${
                event.description
                  ? `
                    <div
                      class="event-description"
                      title="${escapeAttribute(event.description)}"
                    >
                      ${escapeHTML(event.description)}
                    </div>

                    <button
                      type="button"
                      class="event-view-more"
                    >
                      View more
                    </button>
                  `
                  : ""
              }


              ${registrationButton}

            </div>

          `;


          card.addEventListener(
            "click",
            function() {
              openEventModal(event);
            }
          );


          const registerLink =
            card.querySelector(".register-btn");

          if (registerLink) {
            registerLink.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
              }
            );
          }


          const viewMore =
            card.querySelector(".event-view-more");

          if (viewMore) {
            viewMore.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
                openEventModal(event);
              }
            );
          }


          eventsContainer.appendChild(
            card
          );

        }
      );

    }



    /* =========================================
       CALENDAR
    ========================================== */

    function renderCalendar() {

      const year =
        calendarDate.getFullYear();


      const month =
        calendarDate.getMonth();


      const monthName =
        calendarDate.toLocaleString(
          "default",
          {
            month: "long"
          }
        );


      calendarMonth.textContent =
        `${monthName} ${year}`;


      calendarDays.innerHTML =
        "";


      const firstDay =
        new Date(
          year,
          month,
          1
        ).getDay();


      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();



      /* EMPTY DAYS */

      for (
        let i = 0;
        i < firstDay;
        i++
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "calendar-day empty";


        calendarDays.appendChild(
          empty
        );

      }



      /* DAYS */

      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {


        const cell =
          document.createElement(
            "div"
          );


        cell.className =
          "calendar-day";


        const number =
          document.createElement(
            "div"
          );


        number.className =
          "day-number";


        number.textContent =
          day;


        cell.appendChild(
          number
        );


        const dateString =
          createDateString(
            year,
            month + 1,
            day
          );


        const today = new Date();
        const todayString = createDateString(
          today.getFullYear(),
          today.getMonth() + 1,
          today.getDate()
        );

        if (dateString === todayString) {
          cell.classList.add("today");
        }

        if (dateString === selectedCalendarDate) {
          cell.classList.add("selected");
        }


        const dayEvents =
          events.filter(
            function(event) {

              return (
                event.event_date ===
                dateString
              );

            }
          );



        if (dayEvents.length > 0) {

          const eventDot =
            document.createElement(
              "div"
            );


          eventDot.className =
            "event-dot";


          if (dayEvents.length > 1) {

            eventDot.classList.add(
              "multiple"
            );

            eventDot.textContent =
              "";

          }


          if (
            dayEvents.some(
              function(event) {
                return event.is_common;
              }
            )
          ) {

            eventDot.classList.add(
              "common-dot"
            );

          }


          eventDot.title =
            dayEvents.length === 1
              ? "1 event"
              : `${dayEvents.length} events`;


          cell.appendChild(
            eventDot
          );

        }



        cell.addEventListener(
          "click",
          function() {

            selectedCalendarDate =
              dateString;

            renderCalendar();

            showDateEvents(
              dateString
            );

          }
        );


        calendarDays.appendChild(
          cell
        );

      }

    }



    /* =========================================
       DATE EVENTS
    ========================================== */

    function showDateEvents(
      dateString
    ) {


      const dayEvents =
        events.filter(
          function(event) {

            return (
              event.event_date ===
              dateString
            );

          }
        );


      selectedDateEvents.innerHTML =
        "";

      const count = document.createElement("div");
      count.className = "calendar-event-count";
      count.textContent = dayEvents.length === 1
        ? "1 event on this date"
        : `${dayEvents.length} events on this date`;
      selectedDateEvents.appendChild(count);

      const heading =
        document.createElement(
          "h3"
        );


      heading.textContent =
        formatDate(
          dateString
        );


      selectedDateEvents.appendChild(
        heading
      );



      if (!dayEvents.length) {


        const message =
          document.createElement(
            "div"
          );


        message.className =
          "no-events";


        message.textContent =
          "No events on this date.";


        selectedDateEvents.appendChild(
          message
        );


        return;

      }



      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "events-grid";



      dayEvents.forEach(
        function(event) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "event-card";



          const poster =
            event.image_url
              ? `
                <img
                  class="event-poster"
                  src="${escapeAttribute(event.image_url)}"
                  alt="${escapeAttribute(event.title)}"
                  loading="lazy"
                >
              `
              : "";



          const commonBadge =
            event.is_common
              ? `
                <span class="common-badge">
                  Common Event
                </span>
              `
              : "";



          const registrationButton =
            event.registration_link
              ? `
                <a
                  class="register-btn"
                  href="${escapeAttribute(event.registration_link)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Register
                </a>
              `
              : "";



          card.innerHTML = `

            ${poster}

            <div class="event-content">

              ${commonBadge}


              <h3>
                ${escapeHTML(
                  event.title
                )}
              </h3>


              <div class="event-info">


                ${
                  event.event_time
                    ? `
                      <div>

                        <strong>
                          Time:
                        </strong>

                        ${escapeHTML(
                          formatTime(
                            event.event_time
                          )
                        )}

                      </div>
                    `
                    : ""
                }


                ${
                  event.location
                    ? `
                      <div>

                        <strong>
                          Location:
                        </strong>

                        ${escapeHTML(
                          event.location
                        )}

                      </div>
                    `
                    : ""
                }


              </div>


              ${
                event.description
                  ? `
                    <div
                      class="event-description"
                      title="${escapeAttribute(event.description)}"
                    >
                      ${escapeHTML(event.description)}
                    </div>

                    <button
                      type="button"
                      class="event-view-more"
                    >
                      View more
                    </button>
                  `
                  : ""
              }


              ${registrationButton}

            </div>

          `;


          card.addEventListener(
            "click",
            function() {
              openEventModal(event);
            }
          );


          const registerLink =
            card.querySelector(".register-btn");

          if (registerLink) {
            registerLink.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
              }
            );
          }


          const viewMore =
            card.querySelector(".event-view-more");

          if (viewMore) {
            viewMore.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
                openEventModal(event);
              }
            );
          }


          grid.appendChild(
            card
          );

        }
      );


      selectedDateEvents.appendChild(
        grid
      );

    }



    /* =========================================
       EVENT DETAILS MODAL
    ========================================== */

    function openEventModal(event) {

      eventModalTitle.textContent =
        event.title || "Event";


      eventModalImageWrap.innerHTML =
        event.image_url
          ? `
            <img
              class="event-modal-image"
              src="${escapeAttribute(event.image_url)}"
              alt="${escapeAttribute(event.title || "Event poster")}"
            >
          `
          : `
            <div class="event-modal-no-image">
              No poster available for this event.
            </div>
          `;


      const infoParts = [];

      if (event.event_date) {
        infoParts.push(
          `<div><strong>Date:</strong> ${escapeHTML(formatDate(event.event_date))}</div>`
        );
      }

      if (event.event_time) {
        infoParts.push(
          `<div><strong>Time:</strong> ${escapeHTML(formatTime(event.event_time))}</div>`
        );
      }

      if (event.location) {
        infoParts.push(
          `<div><strong>Location:</strong> ${escapeHTML(event.location)}</div>`
        );
      }

      eventModalInfo.innerHTML =
        infoParts.join("");


      eventModalDescription.textContent =
        event.description || "";

      eventModalDescription.classList.toggle(
        "hidden",
        !event.description
      );


      if (event.registration_link) {
        eventModalActions.innerHTML = `
          <a
            class="event-modal-register"
            href="${escapeAttribute(event.registration_link)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Register
          </a>
        `;
      } else if (event.image_url) {
        eventModalActions.innerHTML = `
          <div class="event-modal-qr-note">
            Scan the QR code in the poster to register.
          </div>
        `;
      } else {
        eventModalActions.innerHTML = "";
      }


      eventModalOverlay.classList.remove(
        "hidden"
      );

      document.body.style.overflow =
        "hidden";
    }


    function closeEventModal() {

      eventModalOverlay.classList.add(
        "hidden"
      );

      document.body.style.overflow =
        "";
    }


    eventModalClose.addEventListener(
      "click",
      closeEventModal
    );


    eventModalOverlay.addEventListener(
      "click",
      function(e) {
        if (e.target === eventModalOverlay) {
          closeEventModal();
        }
      }
    );


    document.addEventListener(
      "keydown",
      function(e) {
        if (
          e.key === "Escape" &&
          !eventModalOverlay.classList.contains("hidden")
        ) {
          closeEventModal();
        }
      }
    );


    /* =========================================
       CALENDAR NAVIGATION
    ========================================== */

    document
      .getElementById(
        "previousMonth"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate.setMonth(
            calendarDate.getMonth() - 1
          );


          renderCalendar();

        }
      );



    document
      .getElementById(
        "nextMonth"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate.setMonth(
            calendarDate.getMonth() + 1
          );


          renderCalendar();

        }
      );



    document
      .getElementById(
        "todayBtn"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate =
            new Date();


          renderCalendar();

        }
      );



    /* =========================================
       DATE HELPERS
    ========================================== */

    function createDateString(
      year,
      month,
      day
    ) {

      return (

        year +

        "-" +

        String(month)
          .padStart(
            2,
            "0"
          ) +

        "-" +

        String(day)
          .padStart(
            2,
            "0"
          )

      );

    }



    function formatDate(
      dateString
    ) {


      const date =
        new Date(
          dateString +
          "T00:00:00"
        );


      return date.toLocaleDateString(
        undefined,
        {

          day: "numeric",

          month: "long",

          year: "numeric"

        }
      );

    }



    function formatTime(
      timeString
    ) {


      const parts =
        timeString.split(":");


      const date =
        new Date();


      date.setHours(

        Number(
          parts[0]
        ),

        Number(
          parts[1]
        ),

        0

      );


      return date.toLocaleTimeString(
        undefined,
        {

          hour: "numeric",

          minute: "2-digit"

        }
      );

    }



    /* =========================================
       SECURITY HELPERS
    ========================================== */

    function escapeHTML(
      value
    ) {


      if (

        value === null ||

        value === undefined

      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    function escapeAttribute(
      value
    ) {

      return escapeHTML(
        value
      );

    }



    /* =========================================
       INITIAL AUTH CHECK
    ========================================== */

    async function initialize() {


      const {

        data: {
          session
        }

      } =
        await supabaseClient
          .auth
          .getSession();


      if (session) {

        showApp();

      }

      else {

        showLogin();

      }

    }


    initialize();

  </script>
