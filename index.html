<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Events</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }


    button,
    input {
      font: inherit;
    }


    .hidden {
      display: none !important;
    }


    /* =========================================
       LOGIN
    ========================================= */

    #loginPage {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background: #f5f7fb;

    }


    .login-box {

      width: 100%;

      max-width: 400px;

      background: white;

      padding: 35px;

      border-radius: 14px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);

    }


    .login-box h1 {

      text-align: center;

      margin-bottom: 8px;

    }


    .login-box p {

      text-align: center;

      color: #6b7280;

      margin-bottom: 25px;

    }


    .form-group {

      margin-bottom: 16px;

    }


    .form-group label {

      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: 600;

    }


    .form-group input {

      width: 100%;

      padding: 12px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      outline: none;

    }


    .form-group input:focus {

      border-color: #2563eb;

    }


    .login-btn {

      width: 100%;

      border: none;

      padding: 12px;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      cursor: pointer;

      font-weight: 600;

    }


    .login-btn:hover {

      background: #1d4ed8;

    }


    #loginMessage {

      margin-top: 15px;

      text-align: center;

      font-size: 14px;

      color: #dc2626;

    }


    /* =========================================
       HEADER
    ========================================= */

    header {

      background: white;

      border-bottom: 1px solid #e5e7eb;

      position: sticky;

      top: 0;

      z-index: 10;

    }


    .header-inner {

      max-width: 1200px;

      margin: auto;

      padding: 15px 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

    }


    .brand {

      font-size: 21px;

      font-weight: 700;

    }


    .logout-btn {

      border: none;

      background: #ef4444;

      color: white;

      padding: 9px 15px;

      border-radius: 7px;

      cursor: pointer;

    }


    /* =========================================
       MAIN
    ========================================= */

    main {

      max-width: 1200px;

      margin: auto;

      padding: 30px 20px 50px;

    }


    .page-title {

      margin-bottom: 25px;

    }


    .page-title h2 {

      font-size: 28px;

      margin-bottom: 5px;

    }


    .page-title p {

      color: #6b7280;

    }


    /* =========================================
       EVENTS
    ========================================= */

    .events-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;

    }


    .event-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }


    /* EVENT DETAILS MODAL */

    .event-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .event-modal {
      width: min(900px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      position: relative;
    }

    .event-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      color: white;
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
    }

    .event-modal-close:hover {
      background: rgba(0,0,0,0.8);
    }

    .event-modal-image-wrap {
      width: 100%;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .event-modal-image {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
    }

    .event-modal-no-image {
      padding: 70px 20px;
      color: white;
      text-align: center;
      font-size: 15px;
    }

    .event-modal-content {
      padding: 22px;
    }

    .event-modal-title {
      font-size: 24px;
      margin-bottom: 14px;
      color: #111827;
    }

    .event-modal-info {
      display: grid;
      gap: 9px;
      margin-bottom: 15px;
    }

    .event-modal-info div {
      color: #4b5563;
      font-size: 14px;
    }

    .event-modal-description {
      color: #4b5563;
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 18px;
    }

    .event-modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .event-modal-register {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 11px 17px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .event-modal-register:hover {
      background: #1d4ed8;
    }

    .event-modal-qr-note {
      padding: 10px 13px;
      border-radius: 7px;
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
    }


    /* POSTER */

    .event-poster {

      width: 100%;

      height: 210px;

      object-fit: cover;

      display: block;

      background: #f3f4f6;

    }


    .event-content {

      padding: 20px;

    }


    .common-badge {

      display: inline-block;

      background: #fef3c7;

      color: #92400e;

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: 600;

      margin-bottom: 12px;

    }


    .event-card h3 {

      font-size: 20px;

      margin-bottom: 12px;

    }


    .event-info {

      margin-bottom: 15px;

    }


    .event-info div {

      margin-bottom: 7px;

      color: #4b5563;

      font-size: 14px;

    }


    .event-description {
      color: #4b5563;
      line-height: 1.5;
      font-size: 14px;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-view-more {
      display: inline-block;
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 16px;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .event-view-more:hover {
      text-decoration: underline;
    }



    .register-btn {

      display: inline-block;

      background: #2563eb;

      color: white;

      text-decoration: none;

      padding: 10px 15px;

      border-radius: 7px;

      font-size: 14px;

      font-weight: 600;

    }


    .register-btn:hover {

      background: #1d4ed8;

    }


    .no-events {

      background: white;

      border: 1px solid #e5e7eb;

      padding: 30px;

      text-align: center;

      border-radius: 12px;

      color: #6b7280;

    }


    /* =========================================
       DASHBOARD LAYOUT + CALENDAR
    ========================================== */

    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 20px;
      align-items: start;
    }

    .events-area {
      min-width: 0;
    }

    .calendar-sidebar {
      min-width: 0;
    }

    .calendar-panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .calendar-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      border-bottom: 1px solid #e5e7eb;
    }

    .calendar-panel-title span {
      font-size: 17px;
    }

    .calendar {
      background: white;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .calendar-header h3 {
      font-size: 14px;
      white-space: nowrap;
    }

    .calendar-nav {
      display: flex;
      gap: 4px;
    }

    .calendar-nav button {
      min-width: 32px;
      min-height: 32px;
      border: 1px solid #d1d5db;
      background: white;
      padding: 4px 7px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .calendar-nav button:hover {
      background: #f3f4f6;
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .calendar-weekdays div {
      padding: 9px 2px;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      border-bottom: 1px solid #e5e7eb;
    }

    .calendar-day {
      min-height: 52px;
      padding: 6px 5px;
      border-right: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
      cursor: pointer;
      position: relative;
      min-width: 0;
    }

    .calendar-day:nth-child(7n) {
      border-right: none;
    }

    .calendar-day:hover {
      background: #f9fafb;
    }

    .calendar-day.empty {
      background: #fafafa;
      cursor: default;
    }

    .calendar-day.today {
      background: #eff6ff;
    }

    .calendar-day.selected {
      box-shadow: inset 0 0 0 2px #2563eb;
      background: #f8fbff;
    }

    .day-number {
      font-size: 12px;
      font-weight: 600;
    }

    .event-dot {
      margin-top: 4px;
      padding: 2px 4px;
      border-radius: 4px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 9px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .common-dot {
      background: #fef3c7;
      color: #92400e;
    }

    .selected-date-events {
      border-top: 1px solid #e5e7eb;
    }

    .selected-date-events h3 {
      margin: 0;
      padding: 13px 16px 5px;
      font-size: 14px;
    }

    .calendar-event-count {
      padding: 4px 16px 10px;
      color: #6b7280;
      font-size: 11px;
    }

    .selected-date-events .events-grid {
      grid-template-columns: 1fr;
      gap: 0;
    }

    .selected-date-events .event-card {
      border: none;
      border-top: 1px solid #f0f1f3;
      border-radius: 0;
      box-shadow: none;
    }

    .selected-date-events .event-poster {
      height: 120px;
    }

    .selected-date-events .event-content {
      padding: 13px 16px 15px;
    }

    .selected-date-events .event-card h3 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .selected-date-events .event-info {
      margin-bottom: 8px;
    }

    .selected-date-events .event-info div {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .selected-date-events .event-description {
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .selected-date-events .register-btn {
      padding: 8px 12px;
      font-size: 12px;
    }

    /* =========================================
       RESPONSIVE
    ========================================== */

    @media (max-width: 600px) {

      .event-modal-overlay {
        padding: 10px;
      }

      .event-modal {
        max-height: calc(100vh - 20px);
        border-radius: 10px;
      }

      .event-modal-image {
        max-height: 55vh;
      }

      .event-modal-content {
        padding: 17px;
      }

      .event-modal-title {
        font-size: 20px;
      }

      .event-modal-info div {
        font-size: 13px;
      }

      .event-modal-actions {
        width: 100%;
      }

      .event-modal-register {
        text-align: center;
        width: 100%;
      }

    }


    @media (max-width: 1050px) {

      .dashboard-layout {
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 16px;
      }

      .events-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .calendar-day {
        min-height: 48px;
        padding: 5px 4px;
      }

      .event-dot {
        font-size: 8px;
      }

    }


    @media (max-width: 780px) {

      .dashboard-layout {
        grid-template-columns: 1fr;
      }

      .calendar-sidebar {
        order: -1;
      }

      .calendar-panel {
        width: 100%;
      }

      .calendar-day {
        min-height: 54px;
      }

      .event-dot {
        font-size: 9px;
      }

    }


    @media (max-width: 600px) {

      .header-inner {
        padding: 13px 15px;
      }

      main {
        padding: 18px 12px 35px;
      }

      .page-title {
        margin-bottom: 18px;
      }

      .page-title h2 {
        font-size: 23px;
      }

      .page-title p {
        font-size: 13px;
      }

      .events-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .event-poster {
        height: 200px;
      }

      .calendar-panel-title {
        padding: 13px 14px;
      }

      .calendar-header {
        padding: 10px 12px;
      }

      .calendar-header h3 {
        font-size: 14px;
      }

      .calendar-weekdays div {
        font-size: 9px;
        padding: 8px 1px;
      }

      .calendar-day {
        min-height: 48px;
        padding: 5px 3px;
      }

      .day-number {
        font-size: 11px;
      }

      .event-dot {
        font-size: 7px;
        padding: 2px 3px;
      }

      .calendar-nav button {
        min-width: 30px;
        min-height: 30px;
      }

    }


    @media (max-width: 360px) {

      main {
        padding-left: 8px;
        padding-right: 8px;
      }

      .calendar-day {
        min-height: 44px;
        padding: 4px 2px;
      }

      .event-dot {
        display: none;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       LOGIN PAGE
  ========================================== -->

  <section id="loginPage">

    <div class="login-box">

      <h1>
        Events
      </h1>

      <p>
        Sign in to view events
      </p>


      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

        </div>


        <button
          class="login-btn"
          type="submit"
        >
          Login
        </button>


        <div id="loginMessage"></div>

      </form>

    </div>

  </section>



  <!-- =========================================
       USER APPLICATION
  ========================================== -->

  <section
    id="app"
    class="hidden"
  >


    <!-- HEADER -->

    <header>

      <div class="header-inner">

        <div class="brand">
          Events
        </div>


        <button
          class="logout-btn"
          id="logoutBtn"
        >
          Logout
        </button>

      </div>

    </header>



    <!-- MAIN -->

    <main>

      <div class="dashboard-layout">

        <section class="events-area">

          <div class="page-title">
            <h2>Upcoming Events</h2>
            <p>View upcoming events and registration details.</p>
          </div>

          <div
            id="eventsContainer"
            class="events-grid"
          ></div>

        </section>

        <aside class="calendar-sidebar">

          <div class="calendar-panel">

            <div class="calendar-panel-title">
              <span>▣</span>
              Event Calendar
            </div>

            <div class="calendar">

              <div class="calendar-header">
                <h3 id="calendarMonth"></h3>

                <div class="calendar-nav">
                  <button id="previousMonth" type="button" aria-label="Previous month">‹</button>
                  <button id="todayBtn" type="button">Today</button>
                  <button id="nextMonth" type="button" aria-label="Next month">›</button>
                </div>
              </div>

              <div class="calendar-weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
              </div>

              <div
                id="calendarDays"
                class="calendar-days"
              ></div>

            </div>

            <div
              id="selectedDateEvents"
              class="selected-date-events"
            ></div>

          </div>

        </aside>

      </div>

    </main>

  </section>



  <!-- =========================================
       EVENT DETAILS MODAL
  ========================================== -->

  <div
    id="eventModalOverlay"
    class="event-modal-overlay hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Event details"
  >

    <div class="event-modal">

      <button
        id="eventModalClose"
        class="event-modal-close"
        type="button"
        aria-label="Close event details"
      >
        ×
      </button>

      <div
        id="eventModalImageWrap"
        class="event-modal-image-wrap"
      ></div>

      <div class="event-modal-content">

        <h2
          id="eventModalTitle"
          class="event-modal-title"
        ></h2>

        <div
          id="eventModalInfo"
          class="event-modal-info"
        ></div>

        <div
          id="eventModalDescription"
          class="event-modal-description"
        ></div>

        <div
          id="eventModalActions"
          class="event-modal-actions"
        ></div>

      </div>

    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>


    /* =========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://wuxluaekflqvvhtghrok.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_5lGI_aAjnq3uQKXBEPqUvA_yf6_eFKL";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =========================================
       VARIABLES
    ========================================== */

    let events = [];

    let calendarDate =
      new Date();

    let selectedCalendarDate =
      null;



    /* =========================================
       ELEMENTS
    ========================================== */

    const loginPage =
      document.getElementById(
        "loginPage"
      );


    const app =
      document.getElementById(
        "app"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const eventsContainer =
      document.getElementById(
        "eventsContainer"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const calendarMonth =
      document.getElementById(
        "calendarMonth"
      );


    const calendarDays =
      document.getElementById(
        "calendarDays"
      );


    const selectedDateEvents =
      document.getElementById(
        "selectedDateEvents"
      );


    const eventModalOverlay =
      document.getElementById(
        "eventModalOverlay"
      );


    const eventModalClose =
      document.getElementById(
        "eventModalClose"
      );


    const eventModalImageWrap =
      document.getElementById(
        "eventModalImageWrap"
      );


    const eventModalTitle =
      document.getElementById(
        "eventModalTitle"
      );


    const eventModalInfo =
      document.getElementById(
        "eventModalInfo"
      );


    const eventModalDescription =
      document.getElementById(
        "eventModalDescription"
      );


    const eventModalActions =
      document.getElementById(
        "eventModalActions"
      );



    /* =========================================
       LOGIN
    ========================================== */

    loginForm.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        loginMessage.textContent =
          "";


        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "password"
            )
            .value;


        const {
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email,

              password

            });


        if (error) {

          console.error(error);


          loginMessage.textContent =
            "Invalid email or password.";


          return;

        }


        loginForm.reset();


        showApp();

      }
    );



    /* =========================================
       LOGOUT
    ========================================== */

    logoutBtn.addEventListener(
      "click",
      async function() {

        await supabaseClient
          .auth
          .signOut();


        showLogin();

      }
    );



    /* =========================================
       AUTH STATE
    ========================================== */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(event, session) {

          if (session) {

            showApp();

          }

          else {

            showLogin();

          }

        }
      );



    /* =========================================
       SHOW LOGIN
    ========================================== */

    function showLogin() {

      loginPage.classList.remove(
        "hidden"
      );


      app.classList.add(
        "hidden"
      );

    }



    /* =========================================
       SHOW APP
    ========================================== */

    async function showApp() {

      loginPage.classList.add(
        "hidden"
      );


      app.classList.remove(
        "hidden"
      );


      await loadEvents();

    }



    /* =========================================
       LOAD EVENTS
    ========================================== */

    async function loadEvents() {

      eventsContainer.innerHTML =
        '<div class="no-events">Loading events...</div>';


      const {
        data,
        error
      } =
        await supabaseClient
          .from("events")
          .select("*")
          .order(
            "event_date",
            {
              ascending: true
            }
          )
          .order(
            "event_time",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(error);


        eventsContainer.innerHTML =
          '<div class="no-events">Unable to load events.</div>';


        return;

      }


      events =
        (data || [])
          .sort(
            function(a, b) {

              const dateCompare =
                b.event_date.localeCompare(
                  a.event_date
                );

              if (dateCompare !== 0) {
                return dateCompare;
              }

              return (
                (b.event_time || "23:59:59")
                  .localeCompare(
                    a.event_time || "23:59:59"
                  )
              );

            }
          );


      renderEvents();


      if (events.length) {
        const todayString = createDateString(
          new Date().getFullYear(),
          new Date().getMonth() + 1,
          new Date().getDate()
        );

        const firstDate =
          events.find(event => event.event_date >= todayString)?.event_date ||
          events[0].event_date;

        selectedCalendarDate = firstDate;
        calendarDate = new Date(firstDate + "T00:00:00");
        renderCalendar();
        showDateEvents(firstDate);
      } else {
        renderCalendar();
        showDateEvents(createDateString(
          calendarDate.getFullYear(),
          calendarDate.getMonth() + 1,
          calendarDate.getDate()
        ));
      }

    }



    /* =========================================
       RENDER EVENTS
    ========================================== */

    function renderEvents() {

      if (!events.length) {

        eventsContainer.innerHTML =
          '<div class="no-events">No events available.</div>';


        return;

      }


      eventsContainer.innerHTML =
        "";


      events.forEach(
        function(event) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "event-card";



          /* POSTER */

          const poster =
            event.image_url
              ? `
                <img
                  class="event-poster"
                  src="${escapeAttribute(event.image_url)}"
                  alt="${escapeAttribute(event.title)}"
                  loading="lazy"
                >
              `
              : "";



          /* COMMON BADGE */

          const commonBadge =
            event.is_common
              ? `
                <span class="common-badge">
                  Common Event
                </span>
              `
              : "";



          /* REGISTRATION */

          const registrationButton =
            event.registration_link
              ? `
                <a
                  class="register-btn"
                  href="${escapeAttribute(event.registration_link)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Register
                </a>
              `
              : "";



          /* DATE */

          const formattedDate =
            formatDate(
              event.event_date
            );



          /* TIME */

          const formattedTime =
            event.event_time
              ? formatTime(
                  event.event_time
                )
              : "";



          card.innerHTML = `

            ${poster}

            <div class="event-content">

              ${commonBadge}


              <h3>
                ${escapeHTML(
                  event.title
                )}
              </h3>


              <div class="event-info">


                <div>

                  <strong>
                    Date:
                  </strong>

                  ${formattedDate}

                </div>


                ${
                  formattedTime
                    ? `
                      <div>

                        <strong>
                          Time:
                        </strong>

                        ${escapeHTML(
                          formattedTime
                        )}

                      </div>
                    `
                    : ""
                }


                ${
                  event.location
                    ? `
                      <div>

                        <strong>
                          Location:
                        </strong>

                        ${escapeHTML(
                          event.location
                        )}

                      </div>
                    `
                    : ""
                }


              </div>


              ${
                event.description
                  ? `
                    <div
                      class="event-description"
                      title="${escapeAttribute(event.description)}"
                    >
                      ${escapeHTML(event.description)}
                    </div>

                    <button
                      type="button"
                      class="event-view-more"
                    >
                      View more
                    </button>
                  `
                  : ""
              }


              ${registrationButton}

            </div>

          `;


          card.addEventListener(
            "click",
            function() {
              openEventModal(event);
            }
          );


          const registerLink =
            card.querySelector(".register-btn");

          if (registerLink) {
            registerLink.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
              }
            );
          }


          const viewMore =
            card.querySelector(".event-view-more");

          if (viewMore) {
            viewMore.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
                openEventModal(event);
              }
            );
          }


          eventsContainer.appendChild(
            card
          );

        }
      );

    }



    /* =========================================
       CALENDAR
    ========================================== */

    function renderCalendar() {

      const year =
        calendarDate.getFullYear();


      const month =
        calendarDate.getMonth();


      const monthName =
        calendarDate.toLocaleString(
          "default",
          {
            month: "long"
          }
        );


      calendarMonth.textContent =
        `${monthName} ${year}`;


      calendarDays.innerHTML =
        "";


      const firstDay =
        new Date(
          year,
          month,
          1
        ).getDay();


      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();



      /* EMPTY DAYS */

      for (
        let i = 0;
        i < firstDay;
        i++
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "calendar-day empty";


        calendarDays.appendChild(
          empty
        );

      }



      /* DAYS */

      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {


        const cell =
          document.createElement(
            "div"
          );


        cell.className =
          "calendar-day";


        const number =
          document.createElement(
            "div"
          );


        number.className =
          "day-number";


        number.textContent =
          day;


        cell.appendChild(
          number
        );


        const dateString =
          createDateString(
            year,
            month + 1,
            day
          );


        const today = new Date();
        const todayString = createDateString(
          today.getFullYear(),
          today.getMonth() + 1,
          today.getDate()
        );

        if (dateString === todayString) {
          cell.classList.add("today");
        }

        if (dateString === selectedCalendarDate) {
          cell.classList.add("selected");
        }


        const dayEvents =
          events.filter(
            function(event) {

              return (
                event.event_date ===
                dateString
              );

            }
          );



        dayEvents.forEach(
          function(event) {


            const eventDot =
              document.createElement(
                "div"
              );


            eventDot.className =
              "event-dot";


            if (
              event.is_common
            ) {

              eventDot.classList.add(
                "common-dot"
              );

            }


            eventDot.textContent =
              event.title;


            cell.appendChild(
              eventDot
            );

          }
        );



        cell.addEventListener(
          "click",
          function() {

            selectedCalendarDate =
              dateString;

            renderCalendar();

            showDateEvents(
              dateString
            );

          }
        );


        calendarDays.appendChild(
          cell
        );

      }

    }



    /* =========================================
       DATE EVENTS
    ========================================== */

    function showDateEvents(
      dateString
    ) {


      const dayEvents =
        events.filter(
          function(event) {

            return (
              event.event_date ===
              dateString
            );

          }
        );


      selectedDateEvents.innerHTML =
        "";

      const count = document.createElement("div");
      count.className = "calendar-event-count";
      count.textContent = dayEvents.length === 1
        ? "1 event on this date"
        : `${dayEvents.length} events on this date`;
      selectedDateEvents.appendChild(count);

      const heading =
        document.createElement(
          "h3"
        );


      heading.textContent =
        formatDate(
          dateString
        );


      selectedDateEvents.appendChild(
        heading
      );



      if (!dayEvents.length) {


        const message =
          document.createElement(
            "div"
          );


        message.className =
          "no-events";


        message.textContent =
          "No events on this date.";


        selectedDateEvents.appendChild(
          message
        );


        return;

      }



      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "events-grid";



      dayEvents.forEach(
        function(event) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "event-card";



          const poster =
            event.image_url
              ? `
                <img
                  class="event-poster"
                  src="${escapeAttribute(event.image_url)}"
                  alt="${escapeAttribute(event.title)}"
                  loading="lazy"
                >
              `
              : "";



          const commonBadge =
            event.is_common
              ? `
                <span class="common-badge">
                  Common Event
                </span>
              `
              : "";



          const registrationButton =
            event.registration_link
              ? `
                <a
                  class="register-btn"
                  href="${escapeAttribute(event.registration_link)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Register
                </a>
              `
              : "";



          card.innerHTML = `

            ${poster}

            <div class="event-content">

              ${commonBadge}


              <h3>
                ${escapeHTML(
                  event.title
                )}
              </h3>


              <div class="event-info">


                ${
                  event.event_time
                    ? `
                      <div>

                        <strong>
                          Time:
                        </strong>

                        ${escapeHTML(
                          formatTime(
                            event.event_time
                          )
                        )}

                      </div>
                    `
                    : ""
                }


                ${
                  event.location
                    ? `
                      <div>

                        <strong>
                          Location:
                        </strong>

                        ${escapeHTML(
                          event.location
                        )}

                      </div>
                    `
                    : ""
                }


              </div>


              ${
                event.description
                  ? `
                    <div
                      class="event-description"
                      title="${escapeAttribute(event.description)}"
                    >
                      ${escapeHTML(event.description)}
                    </div>

                    <button
                      type="button"
                      class="event-view-more"
                    >
                      View more
                    </button>
                  `
                  : ""
              }


              ${registrationButton}

            </div>

          `;


          card.addEventListener(
            "click",
            function() {
              openEventModal(event);
            }
          );


          const registerLink =
            card.querySelector(".register-btn");

          if (registerLink) {
            registerLink.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
              }
            );
          }


          const viewMore =
            card.querySelector(".event-view-more");

          if (viewMore) {
            viewMore.addEventListener(
              "click",
              function(e) {
                e.stopPropagation();
                openEventModal(event);
              }
            );
          }


          grid.appendChild(
            card
          );

        }
      );


      selectedDateEvents.appendChild(
        grid
      );

    }



    /* =========================================
       EVENT DETAILS MODAL
    ========================================== */

    function openEventModal(event) {

      eventModalTitle.textContent =
        event.title || "Event";


      eventModalImageWrap.innerHTML =
        event.image_url
          ? `
            <img
              class="event-modal-image"
              src="${escapeAttribute(event.image_url)}"
              alt="${escapeAttribute(event.title || "Event poster")}"
            >
          `
          : `
            <div class="event-modal-no-image">
              No poster available for this event.
            </div>
          `;


      const infoParts = [];

      if (event.event_date) {
        infoParts.push(
          `<div><strong>Date:</strong> ${escapeHTML(formatDate(event.event_date))}</div>`
        );
      }

      if (event.event_time) {
        infoParts.push(
          `<div><strong>Time:</strong> ${escapeHTML(formatTime(event.event_time))}</div>`
        );
      }

      if (event.location) {
        infoParts.push(
          `<div><strong>Location:</strong> ${escapeHTML(event.location)}</div>`
        );
      }

      eventModalInfo.innerHTML =
        infoParts.join("");


      eventModalDescription.textContent =
        event.description || "";

      eventModalDescription.classList.toggle(
        "hidden",
        !event.description
      );


      if (event.registration_link) {
        eventModalActions.innerHTML = `
          <a
            class="event-modal-register"
            href="${escapeAttribute(event.registration_link)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Register
          </a>
        `;
      } else if (event.image_url) {
        eventModalActions.innerHTML = `
          <div class="event-modal-qr-note">
            Scan the QR code in the poster to register.
          </div>
        `;
      } else {
        eventModalActions.innerHTML = "";
      }


      eventModalOverlay.classList.remove(
        "hidden"
      );

      document.body.style.overflow =
        "hidden";
    }


    function closeEventModal() {

      eventModalOverlay.classList.add(
        "hidden"
      );

      document.body.style.overflow =
        "";
    }


    eventModalClose.addEventListener(
      "click",
      closeEventModal
    );


    eventModalOverlay.addEventListener(
      "click",
      function(e) {
        if (e.target === eventModalOverlay) {
          closeEventModal();
        }
      }
    );


    document.addEventListener(
      "keydown",
      function(e) {
        if (
          e.key === "Escape" &&
          !eventModalOverlay.classList.contains("hidden")
        ) {
          closeEventModal();
        }
      }
    );


    /* =========================================
       CALENDAR NAVIGATION
    ========================================== */

    document
      .getElementById(
        "previousMonth"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate.setMonth(
            calendarDate.getMonth() - 1
          );


          renderCalendar();

        }
      );



    document
      .getElementById(
        "nextMonth"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate.setMonth(
            calendarDate.getMonth() + 1
          );


          renderCalendar();

        }
      );



    document
      .getElementById(
        "todayBtn"
      )
      .addEventListener(
        "click",
        function() {


          calendarDate =
            new Date();


          renderCalendar();

        }
      );



    /* =========================================
       DATE HELPERS
    ========================================== */

    function createDateString(
      year,
      month,
      day
    ) {

      return (

        year +

        "-" +

        String(month)
          .padStart(
            2,
            "0"
          ) +

        "-" +

        String(day)
          .padStart(
            2,
            "0"
          )

      );

    }



    function formatDate(
      dateString
    ) {


      const date =
        new Date(
          dateString +
          "T00:00:00"
        );


      return date.toLocaleDateString(
        undefined,
        {

          day: "numeric",

          month: "long",

          year: "numeric"

        }
      );

    }



    function formatTime(
      timeString
    ) {


      const parts =
        timeString.split(":");


      const date =
        new Date();


      date.setHours(

        Number(
          parts[0]
        ),

        Number(
          parts[1]
        ),

        0

      );


      return date.toLocaleTimeString(
        undefined,
        {

          hour: "numeric",

          minute: "2-digit"

        }
      );

    }



    /* =========================================
       SECURITY HELPERS
    ========================================== */

    function escapeHTML(
      value
    ) {


      if (

        value === null ||

        value === undefined

      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    function escapeAttribute(
      value
    ) {

      return escapeHTML(
        value
      );

    }



    /* =========================================
       INITIAL AUTH CHECK
    ========================================== */

    async function initialize() {


      const {

        data: {
          session
        }

      } =
        await supabaseClient
          .auth
          .getSession();


      if (session) {

        showApp();

      }

      else {

        showLogin();

      }

    }


    initialize();

  </script>
